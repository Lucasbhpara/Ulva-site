<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1B2C">
<title>Correção da Visita Técnica · ULVA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 160 160%27%3E%3Crect width=%27160%27 height=%27160%27 rx=%2736%27 fill=%27%230E1B2C%27/%3E%3Cpath d=%27M42 36 V84 A38 38 0 0 0 118 84 V36%27 fill=%27none%27 stroke=%27%23F4F5F7%27 stroke-width=%2720%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2780%27 cy=%2774%27 r=%2715%27 fill=%27%232F7BFF%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#F3F5F8; --card:#fff; --border:#E1E6EE; --navy:#0E1B2C; --accent:#2F7BFF; --accent-soft:#E8F0FF;
    --text:#0E1B2C; --text-2:#4F5B6B; --muted:#7D8898; --green:#1E8E5A; --green-bg:#E3F5EC; --orange:#A86200; --orange-bg:#FFF1DB; --red:#D23C33; --red-bg:#FDE8E6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:Manrope,system-ui,sans-serif; font-size:15px; }
  .topo { background:var(--navy); color:#fff; padding:18px 18px 22px; padding-top:calc(18px + env(safe-area-inset-top)); }
  .marca { display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.12em; font-size:12px; color:#AEB8C6; }
  .topo h1 { margin:10px 0 4px; font-size:22px; line-height:1.2; }
  .topo .sub { color:#C9D2DE; font-size:13.5px; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:14px 14px 120px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-top:12px; }
  .lbl { font-size:12px; font-weight:700; color:var(--text-2); margin:10px 0 6px; }
  input[type=text], textarea { width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 12px; font:inherit; font-size:16px; background:#fff; color:var(--text); }
  textarea { min-height:84px; resize:vertical; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { border:1.5px solid var(--border); background:#fff; border-radius:999px; padding:8px 14px; font:inherit; font-weight:700; font-size:14px; color:var(--text-2); }
  .chip.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .chip.on.verde { border-color:var(--green); background:var(--green-bg); color:var(--green); }
  .chip.on.laranja { border-color:var(--orange); background:var(--orange-bg); color:var(--orange); }
  .progresso { display:flex; align-items:center; gap:10px; font-weight:700; font-size:13.5px; color:var(--text-2); }
  .barra { flex:1; height:8px; background:#E7EBF2; border-radius:99px; overflow:hidden; }
  .barra i { display:block; height:100%; background:var(--green); border-radius:99px; transition:width .3s; }
  .item-topo { display:flex; gap:10px; align-items:flex-start; }
  .num { flex:none; width:26px; height:26px; border-radius:50%; background:var(--red-bg); color:var(--red); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .item-txt { font-weight:700; line-height:1.4; flex:1; }
  .item-obs { color:var(--text-2); font-size:13.5px; margin-top:4px; line-height:1.45; font-weight:500; }
  .tema { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:4px; }
  .status { display:inline-block; font-size:12px; font-weight:800; padding:4px 10px; border-radius:99px; margin-top:8px; }
  .s-pend { background:var(--red-bg); color:var(--red); } .s-env { background:var(--accent-soft); color:var(--accent); }
  .s-ok { background:var(--green-bg); color:var(--green); } .s-dev { background:var(--orange-bg); color:var(--orange); }
  .fotos { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .fotos .f { position:relative; width:78px; height:78px; border-radius:10px; overflow:hidden; background:#E7EBF2; }
  .fotos img { width:100%; height:100%; object-fit:cover; display:block; }
  .fotos .x { position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(14,27,44,.75); color:#fff; font-weight:800; font-size:14px; }
  .add-foto { width:78px; height:78px; border-radius:10px; border:1.5px dashed #AEB8C6; background:#fff; color:var(--text-2); font:inherit; font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .add-foto b { font-size:22px; line-height:1; }
  .btn { width:100%; border:0; border-radius:12px; padding:14px; font:inherit; font-weight:800; font-size:15.5px; background:var(--accent); color:#fff; margin-top:12px; }
  .btn:disabled { opacity:.55; }
  .btn.sec { background:#fff; color:var(--accent); border:1.5px solid var(--accent); }
  .resp { background:#F7F9FC; border-radius:10px; padding:10px 12px; margin-top:10px; font-size:13.5px; line-height:1.5; color:var(--text-2); }
  .resp b { color:var(--text); }
  .vet-fotos { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .vet-fotos img { width:58px; height:58px; object-fit:cover; border-radius:8px; }
  .aviso { text-align:center; padding:40px 20px; color:var(--text-2); line-height:1.6; }
  .aviso h2 { color:var(--text); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 18px; border-radius:12px; font-weight:700; font-size:14px; z-index:50; max-width:90vw; text-align:center; }
  .toast.erro { background:var(--red); }
  .zoom { position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; z-index:60; }
  .zoom img { max-width:96vw; max-height:90vh; }
  .rodape { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<div class="topo">
  <div class="marca">ULVA · VISITA TÉCNICA</div>
  <h1 id="titulo">Carregando…</h1>
  <div class="sub" id="subtitulo"></div>
</div>
<main id="app"></main>

<script>
const SUPABASE_URL = 'https://llstmcmgormolhbnszap.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Kk5u4REY7PUWKMpx9wlZnA_BXgfqrxF';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = 'visita-tecnica-fotos';
const SETORES = { acougue: 'Açougue', frios: 'Frios', padaria: 'Padaria', flv: 'Hortifrúti (FLV)', deposito: 'Depósito', mercearia: 'Mercearia', geral: 'Geral e Documentos' };
const TEMAS_LIVRE = ['Limpeza', 'Organização', 'Validade / Tara', 'Planilhas e processos administrativos', 'Outros'];
const FUNCOES = ['Encarregado', 'Gerente', 'Subgerente', 'Outro'];

const st = { visita: null, itens: [], correcoes: {}, rascunho: {}, enviando: {} };
const app = document.getElementById('app');

function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function dataBr(iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR') : '—'; }
function dataHoraBr(iso) { const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function numeroDoc(v) { return v.numero != null ? 'VT-' + String(v.finalizada_em || v.iniciada_em || '').slice(0, 4) + '-' + String(v.numero).padStart(4, '0') : ''; }
function toast(msg, tipo) { const el = document.createElement('div'); el.className = 'toast ' + (tipo || ''); el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3800); }
function fotosDe(r) { return (r.fotos_urls && r.fotos_urls.length) ? r.fotos_urls : (r.foto_url ? [r.foto_url] : []); }
function ampliar(url) { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img src="' + esc(url) + '">'; z.onclick = () => z.remove(); document.body.appendChild(z); }

// Quem está respondendo: guardado no celular para não digitar de novo.
const quem = (() => { try { return JSON.parse(localStorage.getItem('ulva-corr-quem') || '{}'); } catch (e) { return {}; } })();
function salvarQuem() { try { localStorage.setItem('ulva-corr-quem', JSON.stringify(quem)); } catch (e) {} }

async function iniciar() {
  const token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[a-f0-9]{20,}$/i.test(token)) return erro('Link incompleto', 'Peça ao veterinário ou ao gerente o link completo da correção.');
  st.token = token;
  let pin = ''; try { pin = localStorage.getItem('ulva-corr-pin:' + token) || ''; } catch (e) {}
  if (!pin) return pedirCodigo();
  const { data: v, error } = await sb.from('visitas_tecnicas')
    .select('id, numero, unidade, setor, modelo, status, veterinario_nome, iniciada_em, finalizada_em')
    .eq('token_loja', token).eq('pin_loja', pin).maybeSingle();
  if (error) return erro('Sem conexão', 'Não consegui abrir a correção. Confira a internet e tente de novo.');
  if (!v) { try { localStorage.removeItem('ulva-corr-pin:' + token); } catch (e) {} return pedirCodigo('Código errado. Confira na folha impressa ou peça ao gerente.'); }
  st.visita = v;
  document.getElementById('titulo').textContent = 'Correção · ' + (SETORES[v.setor] || v.setor);
  document.getElementById('subtitulo').innerHTML = 'Loja ' + esc(v.unidade || '—') + ' · ' + esc(numeroDoc(v)) + '<br>Visita de ' + dataBr(v.finalizada_em || v.iniciada_em) + ' · Téc. ' + esc(v.veterinario_nome || '');
  const [r, c] = await Promise.all([
    sb.from('visita_tecnica_respostas').select('id, pergunta_texto, justificativa, critico, fotos_urls, foto_url, respondida_em').eq('visita_id', v.id).eq('resposta', 'nao').order('respondida_em'),
    sb.from('vt_correcao_loja').select('*').eq('visita_id', v.id),
  ]);
  if (r.error || c.error) return erro('Sem conexão', 'Não consegui carregar os itens. Confira a internet e tente de novo.');
  let itens = r.data || [];
  if (v.modelo === 'livre') {
    const ordem = (t) => { const i = TEMAS_LIVRE.indexOf(t); return i < 0 ? 99 : i; };
    itens = itens.slice().sort((a, b) => ordem(a.pergunta_texto) - ordem(b.pergunta_texto));
  }
  st.itens = itens;
  (c.data || []).forEach((x) => { st.correcoes[x.resposta_id] = x; });
  desenhar();
}

// Código de acesso de 4 números: vem impresso na folha do setor e o gerente
// ou o veterinário passa para a loja. Fica guardado neste celular.
function pedirCodigo(aviso) {
  document.getElementById('titulo').textContent = 'Correção da visita';
  document.getElementById('subtitulo').textContent = 'Digite o código de acesso para continuar.';
  app.innerHTML = '<div class="card"><div class="lbl">Código de acesso</div><input type="text" id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="••••" style="font-size:28px;letter-spacing:.4em;text-align:center">' +
    (aviso ? '<div class="item-obs" style="color:var(--red);margin-top:8px">' + esc(aviso) + '</div>' : '') +
    '<div class="item-obs" style="margin-top:10px">O código está impresso na folha do setor, ao lado do QR code. Se não tiver, peça ao gerente ou ao veterinário.</div>' +
    '<button class="btn" id="btn-pin">Entrar</button></div>';
  const i = document.getElementById('pin'), btn = document.getElementById('btn-pin');
  const ir = () => { const v = i.value.replace(/\D/g, ''); if (v.length !== 4) { i.focus(); return; } try { localStorage.setItem('ulva-corr-pin:' + st.token, v); } catch (e) {} app.innerHTML = '<div class="aviso">Abrindo…</div>'; iniciar(); };
  btn.onclick = ir; i.addEventListener('keydown', (e) => { if (e.key === 'Enter') ir(); }); i.addEventListener('input', () => { if (i.value.replace(/\D/g, '').length === 4) ir(); });
  setTimeout(() => i.focus(), 100);
}
function erro(t, msg) { document.getElementById('titulo').textContent = 'Correção da visita'; app.innerHTML = '<div class="aviso"><h2>' + esc(t) + '</h2><p>' + esc(msg) + '</p></div>'; }

function textoItem(r) {
  if (st.visita.modelo === 'livre') return { tema: r.pergunta_texto, texto: r.justificativa || '(sem texto)', obs: '' };
  return { tema: '', texto: r.pergunta_texto, obs: r.justificativa || '' };
}
function situacao(c) {
  if (!c) return ['Corrigir', 's-pend'];
  if (c.avaliacao === 'aprovado') return ['Aprovado', 's-ok'];
  if (c.avaliacao === 'devolvido') return ['Devolvido para refazer', 's-dev'];
  return [c.status === 'nao_possivel' ? 'Enviado · não foi possível' : 'Enviado · aguardando conferência', 's-env'];
}

function desenhar() {
  const total = st.itens.length;
  if (!total) { app.innerHTML = '<div class="aviso"><h2>Nada para corrigir</h2><p>Esta visita não teve não conformidades. Bom trabalho!</p></div>'; return; }
  const feitos = st.itens.filter((r) => { const c = st.correcoes[r.id]; return c && c.avaliacao !== 'devolvido'; }).length;
  let h = '<div class="card"><div class="progresso"><span>' + feitos + ' de ' + total + ' respondidos</span><div class="barra"><i style="width:' + Math.round(100 * feitos / total) + '%"></i></div></div>' +
    '<div class="lbl">Seu nome</div><input type="text" id="quem-nome" autocomplete="name" placeholder="Nome de quem está corrigindo" value="' + esc(quem.nome || '') + '">' +
    '<div class="lbl">Função</div><div class="chips">' + FUNCOES.map((f) => '<button class="chip' + (quem.funcao === f ? ' on' : '') + '" onclick="escolherFuncao(\'' + f + '\')">' + f + '</button>').join('') + '</div>' +
    '<div class="item-obs" style="margin-top:12px">Para cada item: marque se foi corrigido, escreva o que foi feito e tire uma foto de como ficou. Cada item é enviado na hora.</div></div>';
  st.itens.forEach((r, i) => { h += cardItem(r, i); });
  h += '<div class="rodape">ULVA · Visita Técnica de Boas Práticas</div>';
  app.innerHTML = h;
  const nome = document.getElementById('quem-nome');
  nome.addEventListener('input', () => { quem.nome = nome.value.trim(); salvarQuem(); });
}

function cardItem(r, i) {
  const t = textoItem(r), c = st.correcoes[r.id], [sit, cls] = situacao(c);
  const vetFotos = fotosDe(r);
  let h = '<div class="card" id="item-' + r.id + '">' + (t.tema ? '<div class="tema">' + esc(t.tema) + '</div>' : '') +
    '<div class="item-topo"><div class="num">' + (i + 1) + '</div><div class="item-txt">' + esc(t.texto) + (r.critico ? ' <span style="color:var(--red);font-size:11px;font-weight:800">CRÍTICO</span>' : '') +
    (t.obs ? '<div class="item-obs">' + esc(t.obs) + '</div>' : '') + '</div></div>' +
    (vetFotos.length ? '<div class="vet-fotos">' + vetFotos.map((u) => '<img src="' + esc(u) + '" onclick="ampliar(\'' + esc(u) + '\')" alt="Foto do veterinário">').join('') + '</div>' : '') +
    '<span class="status ' + cls + '">' + sit + '</span>';
  const editavel = !c || c.avaliacao === 'devolvido' || (c && !c.avaliacao && st.rascunho[r.id]);
  if (c && c.avaliacao === 'devolvido' && c.avaliacao_obs) h += '<div class="resp" style="background:var(--orange-bg)"><b>Motivo:</b> ' + esc(c.avaliacao_obs) + '</div>';
  if (c && !editavel) {
    h += '<div class="resp"><b>' + (c.status === 'nao_possivel' ? 'Não foi possível' : 'O que foi feito') + ':</b> ' + esc(c.comentario || '—') + '<br>' +
      esc(c.respondido_por || '') + (c.respondido_funcao ? ' · ' + esc(c.respondido_funcao) : '') + ' · ' + dataHoraBr(c.respondido_em) + '</div>' +
      (c.fotos_urls && c.fotos_urls.length ? '<div class="fotos">' + c.fotos_urls.map((u) => '<div class="f"><img src="' + esc(u) + '" onclick="ampliar(\'' + esc(u) + '\')"></div>').join('') + '</div>' : '');
    if (!c.avaliacao) h += '<button class="btn sec" onclick="editar(\'' + r.id + '\')">Alterar resposta</button>';
    return h + '</div>';
  }
  const d = rascunho(r.id);
  const enviando = !!st.enviando[r.id];
  h += '<div class="lbl">Situação</div><div class="chips">' +
    '<button class="chip verde' + (d.status === 'corrigido' ? ' on' : '') + '" onclick="marcar(\'' + r.id + '\',\'corrigido\')">Corrigido</button>' +
    '<button class="chip laranja' + (d.status === 'nao_possivel' ? ' on' : '') + '" onclick="marcar(\'' + r.id + '\',\'nao_possivel\')">Não foi possível</button></div>' +
    '<div class="lbl">' + (d.status === 'nao_possivel' ? 'Por que não foi possível?' : 'O que foi feito?') + '</div>' +
    '<textarea id="txt-' + r.id + '" placeholder="Ex.: bancada lavada e higienizada; etiquetas refeitas" oninput="st.rascunho[\'' + r.id + '\'].comentario=this.value">' + esc(d.comentario) + '</textarea>' +
    '<div class="lbl">Fotos de como ficou</div><div class="fotos">' +
    d.fotos.map((f, k) => '<div class="f"><img src="' + esc(f.prev) + '"><button class="x" onclick="tirarFoto(\'' + r.id + '\',' + k + ')">×</button></div>').join('') +
    '<label class="add-foto"><b>+</b>Foto<input type="file" accept="image/*" capture="environment" multiple hidden onchange="adicionarFotos(\'' + r.id + '\', this)"></label></div>' +
    '<button class="btn" ' + (enviando ? 'disabled' : '') + ' onclick="enviar(\'' + r.id + '\')">' + (enviando ? 'Enviando…' : 'Enviar este item') + '</button>';
  return h + '</div>';
}

function rascunho(id) {
  if (!st.rascunho[id]) {
    const c = st.correcoes[id];
    st.rascunho[id] = { status: c && c.avaliacao !== 'devolvido' ? c.status : 'corrigido', comentario: c && c.avaliacao !== 'devolvido' ? (c.comentario || '') : '', fotos: c && c.avaliacao !== 'devolvido' ? (c.fotos_urls || []).map((u) => ({ url: u, prev: u })) : [] };
  }
  return st.rascunho[id];
}
function redesenharItem(id) {
  const i = st.itens.findIndex((r) => r.id === id); const el = document.getElementById('item-' + id);
  if (i < 0 || !el) return; const t = document.createElement('div'); t.innerHTML = cardItem(st.itens[i], i); el.replaceWith(t.firstChild);
}
function escolherFuncao(f) { quem.funcao = f; salvarQuem(); document.querySelectorAll('.card:first-child .chip').forEach((b) => b.classList.toggle('on', b.textContent === f)); }
function marcar(id, s) { rascunho(id).status = s; redesenharItem(id); }
function editar(id) { rascunho(id); redesenharItem(id); }
function tirarFoto(id, k) { rascunho(id).fotos.splice(k, 1); redesenharItem(id); }

// Reduz a foto da câmera (vários MB) para ~1280px antes de enviar.
function reduzir(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image(); const url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const max = 1280, esc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob((b) => b ? ok(b) : falha(new Error('foto')), 'image/jpeg', 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('foto')); };
    img.src = url;
  });
}
async function adicionarFotos(id, input) {
  const d = rascunho(id); const arquivos = Array.from(input.files || []);
  for (const a of arquivos) { try { const blob = await reduzir(a); d.fotos.push({ blob, prev: URL.createObjectURL(blob) }); } catch (e) { toast('Não consegui ler uma das fotos.', 'erro'); } }
  redesenharItem(id);
}

async function enviar(id) {
  const d = rascunho(id);
  const txt = document.getElementById('txt-' + id); if (txt) d.comentario = txt.value;
  if (!quem.nome) { toast('Escreva seu nome lá em cima antes de enviar.', 'erro'); document.getElementById('quem-nome').focus(); return; }
  if (!d.comentario.trim()) { toast(d.status === 'nao_possivel' ? 'Explique por que não foi possível.' : 'Escreva o que foi feito.', 'erro'); return; }
  if (d.status === 'corrigido' && !d.fotos.length) { toast('Tire pelo menos uma foto de como ficou.', 'erro'); return; }
  st.enviando[id] = true; redesenharItem(id);
  try {
    const urls = [];
    for (const f of d.fotos) {
      if (f.url) { urls.push(f.url); continue; }
      const nome = 'correcao/' + st.visita.id + '/' + id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.jpg';
      const up = await sb.storage.from(BUCKET).upload(nome, f.blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      const u = sb.storage.from(BUCKET).getPublicUrl(nome).data.publicUrl; f.url = u; urls.push(u);
    }
    const linha = { visita_id: st.visita.id, resposta_id: id, status: d.status, comentario: d.comentario.trim(), fotos_urls: urls,
      respondido_por: quem.nome, respondido_funcao: quem.funcao || null, respondido_em: new Date().toISOString(),
      avaliacao: null, avaliacao_obs: null, avaliado_por: null, avaliado_em: null };
    const { data, error } = await sb.from('vt_correcao_loja').upsert(linha, { onConflict: 'resposta_id' }).select().single();
    if (error) throw error;
    st.correcoes[id] = data; delete st.rascunho[id];
    toast('Item enviado.');
  } catch (e) {
    toast('Não consegui enviar. Confira a internet e tente de novo.', 'erro');
  } finally {
    st.enviando[id] = false; desenhar();
  }
}

iniciar();
</script>
